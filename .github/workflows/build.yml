name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверить Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::На сервере нет Android SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Найти проект
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -q -o "$z"; done
          GW=$(find . -name gradlew -not -path './.git/*' | head -1)
          if [ -z "$GW" ]; then
            echo "::error::Не найден проект. Загрузите zip-архив проекта в корень репозитория."
            exit 1
          fi
          echo "PROJECT=$(dirname "$GW")" >> "$GITHUB_ENV"

      - name: Собрать APK
        run: |
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          NAME=$(sed -n 's/^rootProject.name *= *"\(.*\)"/\1/p' settings.gradle)
          [ -z "$NAME" ] && NAME=app
          mkdir -p "$GITHUB_WORKSPACE/out"
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -e 's/^app-//' -e 's/-release$//' -e 's/^release$//')
            if [ -z "$abi" ]; then out="$NAME.apk"; else out="$NAME-$abi.apk"; fi
            cp "$f" "$GITHUB_WORKSPACE/out/$out"
          done
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Выложить APK в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          body: |
            Большинству телефонов нужен файл **arm64-v8a**.
            Файл **armeabi-v7a** — для старых 32-битных телефонов.
          files: out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
